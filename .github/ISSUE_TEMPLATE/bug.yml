name: Bug report
description: Report a reproducible defect
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include environment and exact commands; remove secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs / screenshots
      description: Redact tokens, personal data and credentials.
