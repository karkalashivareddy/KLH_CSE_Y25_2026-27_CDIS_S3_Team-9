name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build unprivileged web container
        run: docker build --tag cloudresilience-web:ci .
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cloudresilience-web:ci
          version: v0.76.2
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start local API and dependencies
        run: docker compose up -d --build --wait --wait-timeout 180 api
      - name: Seed isolated E2E catalog fixture
        run: docker compose exec -T postgres psql --username=cloudresilience --dbname=cloudresilience --set=ON_ERROR_STOP=1 --no-psqlrc < apps/web/e2e/fixtures/seed-catalog.sql
      - name: Run shopper, checkout, and insufficient-stock journeys
        working-directory: apps/web
        env:
          E2E_CHECKOUT: '1'
        run: npm run test:e2e
      - name: PostgreSQL order and payment restore drill
        run: bash infrastructure/scripts/Test-PostgresE2ERecovery.sh ci-order-recovery recovery_e2e_${{ github.run_id }}_1 ${{ runner.temp }}/cloudresilience-recovery
      - name: Retain PostgreSQL recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/cloudresilience-recovery/
          if-no-files-found: ignore
      - name: Build deployable web container for DAST
        run: docker build --tag cloudresilience-web:dast ./apps/web
      - name: Start deployable web container for DAST
        run: docker run --detach --name cloudresilience-web-dast --network cloudresilience_application --network-alias web --entrypoint nginx cloudresilience-web:dast -g 'daemon off;'
      - name: Verify web security headers
        run: |
          headers_file="${RUNNER_TEMP}/web-response-headers.txt"
          for attempt in $(seq 1 30); do
            if docker exec cloudresilience-web-dast wget -S -O /dev/null http://127.0.0.1:8080/ > "$headers_file" 2>&1; then break; fi
            sleep 2
          done
          test -s "$headers_file"
          cat "$headers_file"
          grep --fixed-strings --ignore-case "Content-Security-Policy: default-src 'self'" "$headers_file"
          grep --fixed-strings --ignore-case 'Referrer-Policy: strict-origin-when-cross-origin' "$headers_file"
          grep --fixed-strings --ignore-case 'X-Content-Type-Options: nosniff' "$headers_file"
          grep --fixed-strings --ignore-case 'X-Frame-Options: DENY' "$headers_file"
          grep --fixed-strings --ignore-case 'Permissions-Policy: camera=(), microphone=(), geolocation=()' "$headers_file"
      - name: Retain web response headers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-response-headers-${{ github.run_id }}
          path: ${{ runner.temp }}/web-response-headers.txt
          if-no-files-found: ignore
      - name: Capture web container diagnostics
        if: always()
        run: |
          {
            docker inspect cloudresilience-web-dast || true
            docker logs cloudresilience-web-dast 2>&1 || true
          } > "${RUNNER_TEMP}/web-container-diagnostics.txt"
          cat "${RUNNER_TEMP}/web-container-diagnostics.txt"
      - name: Retain web container diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-container-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/web-container-diagnostics.txt
          if-no-files-found: ignore
      - name: OWASP ZAP passive baseline
        run: |
          mkdir -p "${RUNNER_TEMP}/zap-results"
          docker run --rm --network cloudresilience_application \
            --volume "${RUNNER_TEMP}/zap-results:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py -t http://web:8080 -m 2 -I -r zap-baseline.html -J zap-baseline.json
      - name: Retain OWASP ZAP reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/zap-results/
          if-no-files-found: ignore
      - name: Show Compose logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker logs cloudresilience-web-dast 2>&1 || true
          docker compose logs --no-color api web postgres redis rabbitmq
      - name: Stop local Compose services
        if: always()
        run: |
          docker rm -f cloudresilience-web-dast 2>/dev/null || true
          docker compose down --volumes --remove-orphans

  api:
    name: API tests and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp -f apps/api/pom.xml verify -DrunIntegrationTests=true
      - name: Build API container
        run: docker build --tag cloudresilience-api:ci ./apps/api
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cloudresilience-api:ci
          version: v0.76.2
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'

  terraform:
    name: Terraform validation and IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infrastructure/terraform
      - run: terraform -chdir=infrastructure/terraform/environments/dev init -backend=false -input=false
      - run: terraform -chdir=infrastructure/terraform/environments/dev validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - name: Initialize TFLint plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --chdir=infrastructure/terraform --init
      - name: Lint Terraform
        run: tflint --chdir=infrastructure/terraform --recursive
      - uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: infrastructure/terraform
          framework: terraform
          soft_fail: false

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  maven-vulnerability-scan:
    name: Maven vulnerability scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      scan-args: |-
        --lockfile=./apps/api/pom.xml
    permissions:
      actions: read
      contents: read
      security-events: write
