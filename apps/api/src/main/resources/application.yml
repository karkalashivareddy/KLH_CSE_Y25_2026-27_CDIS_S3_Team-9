server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: ${APP_SESSION_TIMEOUT:30m}
      cookie:
        name: JSESSIONID
        http-only: true
        secure: ${APP_SECURITY_COOKIE_SECURE:false}
        same-site: lax
spring:
  application:
    name: cloudresilience-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  session:
    store-type: redis
    timeout: ${APP_SESSION_TIMEOUT:30m}
    redis:
      namespace: ${APP_SESSION_REDIS_NAMESPACE:cloudresilience:sessions}
      flush-mode: immediate
      save-mode: on_set_attribute
      cleanup-cron: "0 * * * * *"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_READ_TIMEOUT:2s}
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cloudresilience?connectTimeout=5&socketTimeout=10}
    username: ${SPRING_DATASOURCE_USERNAME:cloudresilience}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  info:
    env:
      enabled: false
info:
  app:
    name: CloudResilience API
    version: 0.1.0
logging:
  structured:
    format:
      console: logstash
