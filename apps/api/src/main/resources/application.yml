server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: ${APP_SESSION_TIMEOUT:30m}
      cookie:
        name: JSESSIONID
        http-only: true
        secure: ${APP_SECURITY_COOKIE_SECURE:false}
        same-site: lax
spring:
  application:
    name: cloudresilience-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  session:
    store-type: redis
    timeout: ${APP_SESSION_TIMEOUT:30m}
    redis:
      namespace: ${APP_SESSION_REDIS_NAMESPACE:cloudresilience:sessions}
      flush-mode: immediate
      save-mode: on_set_attribute
      cleanup-cron: "0 * * * * *"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_READ_TIMEOUT:2s}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:cloudresilience}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 5s
    requested-heartbeat: 30s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: false
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false
        missing-queues-fatal: false
        auto-startup: ${APP_MESSAGING_ENABLED:true}
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cloudresilience?connectTimeout=5&socketTimeout=10}
    username: ${SPRING_DATASOURCE_USERNAME:cloudresilience}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
        messaging:
          include: outbox,eventQueues,rabbit
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  info:
    env:
      enabled: false
info:
  app:
    name: CloudResilience API
    version: 0.1.0
app:
  payment:
    simulator:
      outcome: ${APP_PAYMENT_SIMULATOR_OUTCOME:SUCCESS}
  messaging:
    enabled: ${APP_MESSAGING_ENABLED:true}
    retry-tiers-ms: ${APP_MESSAGING_RETRY_TIERS_MS:5000,30000,120000}
    confirm-timeout-ms: ${APP_MESSAGING_CONFIRM_TIMEOUT_MS:5000}
  outbox:
    publisher:
      enabled: ${APP_OUTBOX_PUBLISHER_ENABLED:true}
      interval-ms: ${APP_OUTBOX_PUBLISHER_INTERVAL_MS:1000}
      initial-delay-ms: ${APP_OUTBOX_PUBLISHER_INITIAL_DELAY_MS:2000}
      batch-size: ${APP_OUTBOX_PUBLISHER_BATCH_SIZE:50}
      lease-seconds: ${APP_OUTBOX_PUBLISHER_LEASE_SECONDS:30}
      max-attempts: ${APP_OUTBOX_PUBLISHER_MAX_ATTEMPTS:8}
      base-backoff-seconds: ${APP_OUTBOX_PUBLISHER_BASE_BACKOFF_SECONDS:2}
      max-backoff-seconds: ${APP_OUTBOX_PUBLISHER_MAX_BACKOFF_SECONDS:300}
logging:
  structured:
    format:
      console: logstash
