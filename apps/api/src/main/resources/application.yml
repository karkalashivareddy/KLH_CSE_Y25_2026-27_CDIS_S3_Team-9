server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
spring:
  application:
    name: cloudresilience-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false
info:
  app:
    name: CloudResilience API
    version: 0.1.0
logging:
  structured:
    format:
      console: logstash
