name: cloudresilience
services:
  web:
    build: ./apps/web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [application]
    restart: unless-stopped

  api:
    build: ./apps/api
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cloudresilience}?connectTimeout=5&socketTimeout=10
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cloudresilience}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      APP_SECURITY_COOKIE_SECURE: ${APP_SECURITY_COOKIE_SECURE:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      APP_SESSION_TIMEOUT: ${APP_SESSION_TIMEOUT:-30m}
      APP_SESSION_REDIS_NAMESPACE: ${APP_SESSION_REDIS_NAMESPACE:-cloudresilience:sessions}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 45s
    networks: [application, data]
    restart: unless-stopped

  api2:
    profiles: [two-api]
    build: ./apps/api
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cloudresilience}?connectTimeout=5&socketTimeout=10
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cloudresilience}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      APP_SECURITY_COOKIE_SECURE: ${APP_SECURITY_COOKIE_SECURE:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      APP_SESSION_TIMEOUT: ${APP_SESSION_TIMEOUT:-30m}
      APP_SESSION_REDIS_NAMESPACE: ${APP_SESSION_REDIS_NAMESPACE:-cloudresilience:sessions}
    ports:
      - "127.0.0.1:${API2_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 45s
    networks:
      application:
        aliases: [api]
      data: {}
    restart: unless-stopped

  postgres:
    image: postgres:17.7-alpine3.22
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudresilience}
      POSTGRES_USER: ${POSTGRES_USER:-cloudresilience}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data]
    restart: unless-stopped

  redis:
    image: redis:8.4.0-alpine3.22
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server --appendonly yes; fi"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [data]
    restart: unless-stopped

networks:
  application:
  data:
    internal: true

volumes:
  postgres-data:
  redis-data:
