  <g font-family="'Segoe UI', 'Inter', system-ui, sans-serif">
    <rect x="48" y="648" width="604" height="56" rx="14" fill="url(#cardFill)" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="676" y="648" width="556" height="56" rx="14" fill="url(#cardFill)" stroke="#ffffff" stroke-opacity="0.08"/>

    <circle cx="72" cy="676" r="4" fill="#22d3ee" class="dash-pulse"/>
    <text x="86" y="673" fill="#67e8f9" font-size="9.5" font-weight="700" letter-spacing="1.8">OBSERVABILITY</text>
    <text x="86" y="691" fill="#cbd5e1" font-size="11" font-weight="600">Prometheus · Grafana · Loki · Tempo · OpenTelemetry</text>

    <circle cx="700" cy="676" r="4" fill="#34d399" class="dash-pulse-slow"/>
    <text x="714" y="673" fill="#6ee7b7" font-size="9.5" font-weight="700" letter-spacing="1.8">SECURITY</text>
    <text x="714" y="691" fill="#cbd5e1" font-size="11" font-weight="600">Gitleaks · Trivy · OSV · TFLint · Checkov · OWASP ZAP</text>
