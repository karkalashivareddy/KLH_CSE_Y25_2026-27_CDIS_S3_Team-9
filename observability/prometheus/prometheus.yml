global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cloudresilience-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [api:8081]
        labels:
          service: cloudresilience-api
          environment: local

